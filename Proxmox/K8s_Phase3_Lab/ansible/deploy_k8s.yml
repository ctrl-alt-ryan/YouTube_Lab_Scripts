---
- name: "XPS Cluster: Automated Infrastructure Setup"
  hosts: k8s_cluster
  become: true
  any_errors_fatal: true

  tasks:
    # --- STAGE 0: NUCLEAR RESET ---
    - name: "Force Release Port 6443 and Clean State"
      ansible.builtin.shell: |
        systemctl stop kubelet || true
        kubeadm reset -f || true
        fuser -k 6443/tcp || true
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        rm -rf /etc/cni/net.d /var/lib/etcd /var/lib/cni/ /home/xpsadmin/.kube
      ignore_errors: true

    - name: "Restart Containerd"
      ansible.builtin.service:
        name: containerd
        state: restarted

    # --- STAGE 1: OS PREP ---
    - name: "Kernel & Swap Prep"
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
        modprobe overlay
        modprobe br_netfilter

    - name: "Configure Sysctl"
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    # --- STAGE 2: INSTALLATION ---
    - name: "Install Containerd & Base Tools"
      ansible.builtin.apt:
        name: [containerd, apt-transport-https, ca-certificates, curl, gpg, python3-kubernetes]
        state: present
        update_cache: yes

    - name: "Configure Containerd (SystemdCgroup)"
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      notify: Restart Containerd

    - name: "Add K8s Repo & Install"
      ansible.builtin.shell: |
        mkdir -p -m 755 /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
        apt-get update
        apt-get install -y kubelet kubeadm kubectl
        apt-mark hold kubelet kubeadm kubectl

    # --- STAGE 3: CONTROLLER INIT & PERMISSIONS ---
    - name: "Initialize Control Plane"
      when: inventory_hostname == 'k8s-controller-01'
      block:
        - name: "Kubeadm Init (Overwriting existing locks)"
          ansible.builtin.shell: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address=10.3.160.101 --ignore-preflight-errors=Port-6443

        - name: "Setup Kubeconfig Permissions"
          ansible.builtin.file:
            path: "/home/xpsadmin/.kube"
            state: directory
            owner: xpsadmin
            group: xpsadmin
            mode: '0755'

        - name: "Copy and Own Admin Config"
          ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: /home/xpsadmin/.kube/config
            remote_src: yes
            owner: xpsadmin
            group: xpsadmin
            mode: '0600'

        - name: "Install Flannel CNI"
          become: false
          ansible.builtin.shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

        - name: "Capture Join Command"
          ansible.builtin.shell: kubeadm token create --print-join-command
          register: join_command_raw

    # --- STAGE 4: THE AUTOMATED JOIN ---
    - name: "Join Workers to Cluster"
      when: "'worker' in inventory_hostname"
      ansible.builtin.shell: "{{ hostvars['k8s-controller-01']['join_command_raw']['stdout'] }}"
      register: join_result
      failed_when: "join_result.rc != 0 and 'already exists' not in join_result.stderr"

  handlers:
    - name: Restart Containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
