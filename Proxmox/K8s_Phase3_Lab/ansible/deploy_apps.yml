---
- name: "XPS Cluster: Storage & Apps Deployment"
  hosts: k8s_cluster
  become: true
  any_errors_fatal: true

  tasks:
    # --- STAGE 1: STORAGE PREP ---
    - name: "Prepare 50GB Data Drives"
      when: "'worker' in inventory_hostname"
      block:
        - name: "Install Longhorn Prereqs"
          ansible.builtin.apt:
            name: [open-iscsi, nfs-common, jq]
            state: present

        - name: "Enable iSCSI Service"
          ansible.builtin.service:
            name: iscsid
            state: started
            enabled: true

        - name: "Format /dev/vda"
          community.general.filesystem:
            fstype: xfs
            dev: /dev/vda
            force: no

        - name: "Mount to Longhorn Path"
          ansible.builtin.mount:
            path: /var/lib/longhorn
            src: /dev/vda
            fstype: xfs
            state: mounted

    # --- STAGE 2: HELM & APPS ---
    - name: "Deploy Helm Charts"
      when: inventory_hostname == 'k8s-controller-01'
      become: false
      block:
        - name: "Install Helm Binary"
          ansible.builtin.shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          args:
            creates: /usr/local/bin/helm

        - name: "Add Repos"
          kubernetes.core.helm_repository:
            name: "{{ item.name }}"
            repo_url: "{{ item.url }}"
          loop:
            - { name: 'longhorn', url: 'https://charts.longhorn.io' }
            - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }

        - name: "Create Namespaces"
          kubernetes.core.k8s:
            name: "{{ item }}"
            kind: Namespace
            state: present
          loop: [longhorn-system, monitoring]

        - name: "Install Longhorn (with NodePort 31802)"
          kubernetes.core.helm:
            name: longhorn
            chart_ref: longhorn/longhorn
            release_namespace: longhorn-system
            values:
              defaultSettings:
                defaultDataPath: /var/lib/longhorn
              service:
                ui:
                  type: NodePort
                  nodePort: 31802

        - name: "Install Monitoring (Password: admin)"
          kubernetes.core.helm:
            name: prometheus
            chart_ref: prometheus-community/kube-prometheus-stack
            release_namespace: monitoring
            values:
              grafana:
                adminPassword: admin
                service:
                  type: NodePort
                  nodePort: 32000

        - name: "Deploy OpenSpeedTest"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: openspeedtest, namespace: default }
              spec:
                replicas: 1
                selector: { matchLabels: { app: openspeedtest } }
                template:
                  metadata: { labels: { app: openspeedtest } }
                  spec:
                    containers:
                    - name: openspeedtest
                      image: openspeedtest/latest
                      ports: [{ containerPort: 3000 }]

        - name: "Expose OpenSpeedTest (NodePort 31000)"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata: { name: openspeedtest-svc, namespace: default }
              spec:
                type: NodePort
                selector: { app: openspeedtest }
                ports: [{ port: 3000, targetPort: 3000, nodePort: 31000 }]
