machine:
  install:
    disk: /dev/sda
    wipe: true
    extensions:
      - image: ghcr.io/siderolabs/intel-ucode:latest
      - image: ghcr.io/siderolabs/qemu-guest-agent:latest
      - image: ghcr.io/siderolabs/nfs-utils:latest
  network:
    interfaces:
      - interface: ens18
        dhcp: true
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
