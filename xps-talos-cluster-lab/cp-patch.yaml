machine:
  install:
    disk: /dev/sda
    wipe: true
    extensions:
      - image: ghcr.io/siderolabs/intel-ucode:latest
      - image: ghcr.io/siderolabs/qemu-guest-agent:latest
      - image: ghcr.io/siderolabs/nfs-utils:latest
  network:
    interfaces:
      - interface: ens18 # <--- The Proxmox specific name
        dhcp: true      # We keep DHCP on for the 'fallback', but we'll override it with the static IP in the node patch
        vip:
          ip: 10.3.150.200
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
  kubelet:
    extraArgs:
      kube-reserved: cpu=100m,memory=256Mi
      system-reserved: cpu=100m,memory=256Mi
      eviction-hard: imagefs.available<15%,memory.available<100Mi,nodefs.available<10%
cluster:
  network:
    cni:
      name: none
  etcd:
    advertisedSubnets:
      - 10.3.0.0/16
