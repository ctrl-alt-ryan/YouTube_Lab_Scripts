apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homer-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: synology-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      labels:
        app: homer
    spec:
      containers:
      - name: homer
        image: b4bz/homer:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /www/assets
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homer-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: homer-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: homer
